name: Verify
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Runner provider (Blacksmith requires your own enabled installation)
        type: choice
        required: true
        default: github
        options:
          - github
          - blacksmith
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}-${{ inputs.provider || 'github' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.provider == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-${{ hashFiles('bun.lock', 'patches/**') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test --maxWorkers=2
